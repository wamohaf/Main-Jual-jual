<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFB6C1">
  <meta name="application-name" content="Main Jual-jual">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Main Jual-jual</title>
</head>
<body>
  <!-- HEADER: Tukar Mode & Duit -->
  <header class="game-header" style="justify-content: space-between;">
    <div class="stat-box" style="display: flex; align-items: center; gap: 10px;">
      <div>
        <span>🪙 Money</span>
        <strong id="coinDisplay">RM 0</strong>
      </div>
      <button onclick="resetCoins()" style="background: rgba(255,255,255,0.3); border: none; border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: 14px;">🔄</button>
    </div>
    
    <!-- Butang Tukar Mode -->
    <button id="modeToggleBtn" class="cart-btn" onclick="toggleMode()" style="font-size: 14px; padding: 10px 15px;">
      👤 Buyer Mode
    </button>
  </header>

  <main>
    <!-- ================= SKRIN PEMBELI ================= -->
    <div id="buyerContainer">
      <section id="menuScreen" class="screen active">
        <div class="shop-header">
          <h1>Choose Squishy</h1>
          <p>Tap + to add to cart</p>
        </div>
        <div id="categoryTabs" class="category-tabs"></div>
        <div id="menuGrid" class="menu-grid"></div>
      </section>

      <section id="successScreen" class="screen">
        <div class="success-card">
          <h2>Order Sent! 🎉</h2>
          <p>Please give the phone to the Seller.</p>
          <div class="coin-earned">+ <span id="earnedCoins"></span></div>
          <button onclick="goToMenu()" class="btn-main">Back to Menu</button>
        </div>
      </section>
    </div>

    <!-- ================= SKRIN PENJUAL ================= -->
    <div id="sellerContainer" style="display: none;">
      <div class="seller-header" style="display: flex; justify-content: space-between; align-items: center; background: #3E3134; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #55464A; color: white;">
        <div class="total-sales-box">
          <span style="font-size: 12px; color: #bbb; display: block;">Total Sales</span>
          <strong id="totalSalesDisplay" style="font-size: 24px; color: #DAA520;">RM 0</strong>
        </div>
        <div class="btn-group">
          <button class="btn-action btn-refresh" onclick="fetchOrders()" style="background: #007aff; color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer;">🔄 Refresh</button>
          <button class="btn-action btn-reset" onclick="resetAllOrders()" style="background: #ff3b30; color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer;">🗑️ Reset</button>
        </div>
      </div>
      <h1 style="color: #FF85A2; text-align: center; font-size: 20px;">🛒 Main Jual-jual (Seller)</h1>
      <div id="ordersList">
        <p class="empty" style="text-align: center; color: gray; margin-top: 50px;">Waiting for orders...</p>
      </div>
    </div>
  </main>

  <!-- CART POPUP -->
  <dialog id="cartDialog">
    <div class="modal-head">
      <h2>🛒 Your Cart</h2>
      <button class="close-btn" onclick="closeCart()">×</button>
    </div>
    <div id="cartList" class="cart-list"></div>
    <div class="cart-total">
      <span>Total:</span>
      <strong id="cartTotalPrice">RM 0</strong>
    </div>
    <div style="margin-bottom: 15px;">
      <label style="font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block;">Your Name:</label>
      <input type="text" id="buyerName" placeholder="e.g. Papa" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeCart()">Add More</button>
      <button class="btn-main" id="payBtn" onclick="payAndProcess()">Pay & Send Order</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
