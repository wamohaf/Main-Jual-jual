<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFB6C1">
  <meta name="application-name" content="Main Jual-jual">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Main Jual-jual</title>
</head>
<body>
  <!-- HEADER -->
  <header class="game-header">
    <div class="stat-box" style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 15px;">
      <div>
        <span style="font-size: 12px; display: block; opacity: 0.9;">🪙 Money</span>
        <strong id="coinDisplay" style="font-size: 18px; display: block;">RM 0</strong>
      </div>
      <button onclick="resetCoins()" style="background: rgba(255,255,255,0.3); border: none; border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: 14px;">🔄</button>
    </div>
    
    <div style="display: flex; gap: 8px;">
      <!-- Butang Troli (Hanya untuk Pembeli) -->
      <button id="cartBtn" class="cart-btn" onclick="openCart()" style="position: relative; padding: 8px 12px; font-size: 20px; border-radius: 12px; border: none; background: white; cursor: pointer; box-shadow: 0 3px 0 #d15d79;">
        🛒 <span id="cartCount" class="cart-badge" style="position: absolute; top: -8px; right: -8px; background: #ff3b30; color: white; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 50%;">0</span>
      </button>

      <!-- Butang Tukar Mode -->
      <button id="modeToggleBtn" onclick="toggleMode()" style="font-size: 13px; padding: 10px 15px; border-radius: 12px; border: none; background: white; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #d15d79;">
        👤 Buyer
      </button>
    </div>
  </header>

  <main>
    <!-- SKRIN PEMBELI -->
    <div id="buyerContainer" style="display: block;">
      <section id="menuScreen" class="screen active" style="display: block;">
        <div class="shop-header">
          <h1 id="shopTitle">Choose Squishy</h1>
          <p id="shopSubtitle">Tap + to add to cart</p>
        </div>
        <div id="categoryTabs" class="category-tabs"></div>
        <div id="menuGrid" class="menu-grid"></div>
      </section>

      <section id="successScreen" class="screen" style="display: none;">
        <div class="success-card">
          <h2>Order Sent! 🎉</h2>
          <p>Please give the phone to the Seller.</p>
          <div class="coin-earned">+ <span id="earnedCoins"></span></div>
          <button onclick="goToMenu()" class="btn-main">Back to Menu</button>
        </div>
      </section>
    </div>

    <!-- SKRIN PENJUAL -->
    <div id="sellerContainer" style="display: none;">
      <div class="seller-header">
        <div class="total-sales-box">
          <span>Total Sales</span>
          <strong id="totalSalesDisplay">RM 0</strong>
        </div>
        <div class="btn-group">
          <button class="btn-action btn-refresh" onclick="fetchOrders()">🔄 Refresh</button>
          <button class="btn-action btn-reset" onclick="resetAllOrders()">🗑️ Reset</button>
        </div>
      </div>
      <h1 style="color: #FF85A2; text-align: center; font-size: 20px; margin-top: 10px;">🛒 Main Jual-jual (Seller)</h1>
      <div id="ordersList">
        <p class="empty">Waiting for orders...</p>
      </div>
    </div>
  </main>

  <!-- CART POPUP -->
  <dialog id="cartDialog">
    <div class="modal-head">
      <h2>🛒 Your Cart</h2>
      <button class="close-btn" onclick="closeCart()">×</button>
    </div>
    <div id="cartList" class="cart-list"></div>
    <div class="cart-total">
      <span>Total:</span>
      <strong id="cartTotalPrice">RM 0</strong>
    </div>
    <div style="margin-bottom: 15px;">
      <label style="font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block;">Your Name:</label>
      <input type="text" id="buyerName" placeholder="e.g. Papa" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeCart()">Add More</button>
      <button class="btn-main" id="payBtn" onclick="payAndProcess()">Pay & Send Order</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
