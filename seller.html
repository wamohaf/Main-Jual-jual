<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Main Jual-jual - Seller Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #2C2224; color: white; padding: 20px; margin: 0; }
    
    /* HEADER & TOTAL SALES */
    .seller-header { display: flex; justify-content: space-between; align-items: center; background: #3E3134; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #55464A; }
    .total-sales-box span { font-size: 12px; color: #bbb; display: block; margin-bottom: 5px; }
    .total-sales-box strong { font-size: 24px; color: #DAA520; display: block; }
    .reset-btn { background: #ff3b30; color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .reset-btn:active { transform: scale(0.95); }

    h1 { color: #FF85A2; text-align: center; font-size: 20px; margin-top: 0; margin-bottom: 20px; }
    
    .order-card { background: #3E3134; border-radius: 15px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #FF85A2; }
    .order-card.new { border-left-color: #28a745; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.7; } }
    .buyer-name { font-size: 18px; font-weight: bold; color: #FFB6C1; margin-bottom: 10px; border-bottom: 1px solid #55464A; padding-bottom: 5px; }
    
    .order-items-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .order-item { display: flex; align-items: center; gap: 10px; background: #4A3B3F; padding: 8px; border-radius: 10px; }
    .order-item img { width: 45px; height: 45px; object-fit: contain; background: white; border-radius: 8px; }
    .order-item-info { flex: 1; }
    .order-item-name { font-size: 14px; font-weight: bold; }
    .order-item-qty { font-size: 12px; color: #bbb; }
    
    .total { font-size: 16px; font-weight: bold; color: #DAA520; margin-bottom: 15px; text-align: right; }
    .status-btn { background: #FF85A2; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 15px; }
    .status-btn.done { background: #28a745; cursor: default; }
    .empty { text-align: center; color: gray; margin-top: 50px; }
  </style>
</head>
<body>
  <!-- HEADER: TOTAL SALES & RESET -->
  <div class="seller-header">
    <div class="total-sales-box">
      <span>Total Sales</span>
      <strong id="totalSalesDisplay">RM 0</strong>
    </div>
    <button class="reset-btn" onclick="resetAllOrders()">🔄 Reset</button>
  </div>

  <h1>🛒 Main Jual-jual (Seller)</h1>
  
  <div id="ordersList">
    <p class="empty">Waiting for orders...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://dozlycklbchehbbzfjl.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvemx5Y2tsYmNoZWhiYnpmaWpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTk4NzQsImV4cCI6MjEwNzk3NTg3NH0.tvtGUEQYPA75nBL2KtSJSUqoWcBR5fyObFtvIydK0vc'; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ordersList = document.getElementById('ordersList');
    const totalSalesDisplay = document.getElementById('totalSalesDisplay');

    async function fetchOrders() {
      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) { console.error(error); return; }

      // Kira Total Jualan (Hanya yang berstatus 'done')
      const totalSales = data
        .filter(order => order.status === 'done')
        .reduce((sum, order) => sum + order.total_price, 0);
      
      totalSalesDisplay.textContent = `RM ${totalSales}`;

      // Paparkan Pesanan
      if (data.length === 0) {
        ordersList.innerHTML = '<p class="empty">No orders yet.</p>';
        return;
      }

      ordersList.innerHTML = data.map(order => {
        const isDone = order.status === 'done';
        
        const itemsHtml = order.items.map(i => {
          const imgSrc = i.image ? i.image : 'https://via.placeholder.com/45?text=?';
          return `
            <div class="order-item">
              <img src="${imgSrc}" alt="${i.name}" onerror="this.src='https://via.placeholder.com/45?text=?'">
              <div class="order-item-info">
                <div class="order-item-name">${i.name}</div>
                <div class="order-item-qty">Qty: ${i.qty} | Harga: RM ${i.price}</div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="order-card ${isDone ? '' : 'new'}">
            <div class="buyer-name">👤 ${order.buyer_name}</div>
            <div class="order-items-container">
              ${itemsHtml}
            </div>
            <div class="total">Total: RM ${order.total_price}</div>
            <button class="status-btn ${isDone ? 'done' : ''}" onclick="markDone(${order.id})" ${isDone ? 'disabled' : ''}>
              ${isDone ? '✅ Completed' : 'Mark as Done'}
            </button>
          </div>
        `;
      }).join('');
    }

    // Fungsi Tanda Selesai
    window.markDone = async function(orderId) {
      const { error } = await supabaseClient
        .from('orders')
        .update({ status: 'done' })
        .eq('id', orderId);
      
      if (error) alert("Error updating: " + error.message);
      else fetchOrders();
    };

    // Fungsi Reset Semua Pesanan
    window.resetAllOrders = async function() {
      if (!confirm("Adakah anda pasti mahu padam semua rekod pesanan dan reset total jualan?")) return;

      // Padam semua baris dalam jadual 'orders'
      const { error } = await supabaseClient
        .from('orders')
        .delete()
        .neq('id', 0); // Teknik untuk padam semua rekod

      if (error) {
        alert("Error resetting: " + error.message);
      } else {
        fetchOrders(); // Refresh skrin
      }
    };

    fetchOrders();

    // Realtime listener
    supabaseClient.channel('custom-insert-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
        fetchOrders(); 
      })
      .subscribe();
  </script>
</body>
</html>
